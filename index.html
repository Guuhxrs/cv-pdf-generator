<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Digital Curator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- TOP NAV -->
<header class="topnav">
  <span class="brand">The Digital Curator</span>
  <nav class="topnav-links">
    <a href="#" class="active" onclick="return false">Dashboard</a>
    <a href="#" onclick="return false">My Resumes</a>
    <a href="#" onclick="return false">Templates</a>
  </nav>
  <div class="topnav-actions">
    <button class="btn-clear" onclick="clearData()">Clear Data</button>
    <button class="btn-pdf" onclick="generatePDF()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11v2a1 1 0 001 1h8a1 1 0 001-1v-2M8 2v8M5 8l3 3 3-3"/>
      </svg>
      Generate PDF
    </button>
    <label class="theme-toggle" title="Alternar tema">
      <input type="checkbox" id="theme-checkbox" onchange="toggleTheme(this.checked)" />
      <div class="toggle-track">
        <svg class="toggle-sun" viewBox="0 0 16 16" fill="currentColor">
          <circle cx="8" cy="8" r="3"/>
          <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.2 3.2l1 1M11.8 11.8l1 1M11.8 3.2l-1 1M3.2 11.8l-1 1" fill="none"/>
        </svg>
        <svg class="toggle-moon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M13.5 10A6 6 0 016 2.5a6 6 0 100 11 6 6 0 007.5-3.5z"/>
        </svg>
      </div>
      <div class="toggle-knob"></div>
    </label>
    <button class="topnav-icon" title="Refresh" onclick="updatePreview()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 8A6 6 0 112 8"/><path d="M14 4v4h-4"/>
      </svg>
    </button>
    <button class="topnav-icon" title="Settings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="2.5"/>
        <path d="M8 1.5v1M8 13.5v1M1.5 8h1M13.5 8h1M3.5 3.5l.7.7M11.8 11.8l.7.7M3.5 12.5l.7-.7M11.8 4.2l.7-.7"/>
      </svg>
    </button>
    <div class="avatar">A</div>
  </div>
</header>

<!-- WORKSPACE -->
<div class="workspace">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-label">Editor</div>
    <div class="sidebar-version">Draft v1.0</div>

    <div class="sidebar-item active" onclick="setTab('personal', this)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      </svg>
      Personal Info
    </div>
    <div class="sidebar-item" onclick="setTab('experience', this)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="5" width="14" height="9" rx="1.5"/>
        <path d="M5 5V4a1 1 0 011-1h4a1 1 0 011 1v1"/>
        <path d="M8 9v2"/>
      </svg>
      Experience
    </div>
    <div class="sidebar-item" onclick="setTab('education', this)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2L1 6l7 4 7-4-7-4z"/>
        <path d="M1 6v5"/>
        <path d="M4 8.5V12c0 1.1 1.8 2 4 2s4-.9 4-2V8.5"/>
      </svg>
      Education
    </div>
    <div class="sidebar-item" onclick="setTab('skills', this)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 3H9L7 1H3a1 1 0 00-1 1v12a1 1 0 001 1h10a1 1 0 001-1V4a1 1 0 00-1-1z"/>
      </svg>
      Skills
    </div>
    <div class="sidebar-item" onclick="setTab('certs', this)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/><path d="M5.5 8l2 2 3-3"/>
      </svg>
      Certificados
    </div>
    <div class="sidebar-item" onclick="setTab('projects', this)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="2" width="14" height="12" rx="1.5"/>
        <path d="M1 6h14"/><path d="M5 2v4"/><path d="M11 2v4"/>
      </svg>
      Projetos
    </div>

    <div class="sidebar-bottom">
      <div class="help-item">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="6"/>
          <path d="M8 7c0-1 .7-1.5 1.5-1.5S11 6 11 7c0 1.5-2.5 1.5-2.5 2.5V10"/>
          <circle cx="8.5" cy="12" r=".5" fill="currentColor"/>
        </svg>
        Help
      </div>
    </div>
  </aside>

  <!-- FORM PANEL -->
  <main class="form-panel">

    <!-- PERSONAL INFO -->
    <div id="tab-personal" class="tab-section visible">
      <h2 class="section-title">Informações Pessoais</h2>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nome Completo</label>
          <input class="form-input" id="fullName" type="text" placeholder="Ex: Alex Silva" oninput="liveUpdate()" />
        </div>
        <div class="form-group">
          <label class="form-label">Cargo Atual</label>
          <input class="form-input" id="jobTitle" type="text" placeholder="Ex: Senior UI Designer" oninput="liveUpdate()" />
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input class="form-input" id="email" type="email" placeholder="alex.silva@email.com" oninput="liveUpdate()" />
        </div>
        <div class="form-group">
          <label class="form-label">Telefone</label>
          <input class="form-input" id="phone" type="text" placeholder="+55 11 99999-9999" oninput="liveUpdate()" />
        </div>
        <div class="form-group">
          <label class="form-label">Localização</label>
          <input class="form-input" id="location" type="text" placeholder="São Paulo, SP" oninput="liveUpdate()" />
        </div>
        <div class="form-group">
          <label class="form-label">LinkedIn / Site</label>
          <input class="form-input" id="linkedin" type="text" placeholder="linkedin.com/in/alexsilva" oninput="liveUpdate()" />
        </div>
      </div>

      <div style="margin-top: 24px;">
        <h2 class="section-title">Objetivos</h2>
        <div class="form-group">
          <label class="form-label">Resumo Profissional</label>
          <textarea class="form-textarea" id="summary" placeholder="Descreva seus principais objetivos e conquistas..." oninput="liveUpdate()"></textarea>
        </div>
      </div>

      <div style="margin-top: 24px;">
        <div class="section-header">
          <h2 class="section-title" style="margin-bottom:0">Competências</h2>
          <button class="btn-add" onclick="promptAddTag()">+ Adicionar</button>
        </div>
        <div class="tags-area" id="skills-tags"></div>
        <input id="tag-inline-input" class="tag-input" placeholder="Nova competência..." style="display:none;margin-top:8px;" onkeydown="handleTagInput(event)" />
      </div>
    </div>

    <!-- EXPERIENCE -->
    <div id="tab-experience" class="tab-section">
      <div class="section-header">
        <h2 class="section-title" style="margin-bottom:0">Experiência</h2>
        <button class="btn-add" onclick="addExperience()">+ Adicionar</button>
      </div>
      <div id="experience-list"></div>
    </div>

    <!-- EDUCATION -->
    <div id="tab-education" class="tab-section">
      <div class="section-header">
        <h2 class="section-title" style="margin-bottom:0">Formação</h2>
        <button class="btn-add" onclick="addEducation()">+ Adicionar</button>
      </div>
      <div id="education-list"></div>
    </div>

    <!-- SKILLS -->
    <div id="tab-skills" class="tab-section">
      <div class="section-header">
        <h2 class="section-title" style="margin-bottom:0">Habilidades</h2>
        <button class="btn-add" onclick="addSkill()">+ Adicionar</button>
      </div>
      <div id="skills-list"></div>
    </div>

    <!-- CERTS -->
    <div id="tab-certs" class="tab-section">
      <div class="section-header">
        <h2 class="section-title" style="margin-bottom:0">Certificados</h2>
        <button class="btn-add" onclick="addCert()">+ Adicionar</button>
      </div>
      <div id="certs-list"></div>
    </div>

    <!-- PROJECTS -->
    <div id="tab-projects" class="tab-section">
      <div class="section-header">
        <h2 class="section-title" style="margin-bottom:0">Projetos</h2>
        <button class="btn-add" onclick="addProject()">+ Adicionar</button>
      </div>
      <div id="projects-list"></div>
    </div>

    <div class="btn-update-wrap">
      <button class="btn-update" onclick="updatePreview()">Update Preview</button>
    </div>
  </main>

  <!-- PREVIEW PANEL -->
  <aside class="preview-panel">
    <div class="preview-header">
      <div>
        <div class="preview-title">Prévia do PDF</div>
        <div class="preview-subtitle">Visualização em tempo real</div>
      </div>
      <div class="preview-actions">
        <button class="preview-icon-btn" title="Zoom out" onclick="zoomPreview(-0.1)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="7" cy="7" r="4.5"/><path d="M5 7h4M11 11l2.5 2.5"/>
          </svg>
        </button>
        <button class="preview-icon-btn" title="Zoom in" onclick="zoomPreview(0.1)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="7" cy="7" r="4.5"/><path d="M7 5v4M5 7h4M11 11l2.5 2.5"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="preview-scroll">
      <div class="cv-doc" id="cv-doc" style="transform-origin: top center; transition: transform .2s;">
        <!-- rendered by JS -->
      </div>
    </div>
  </aside>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
